<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>Suplier Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <button class="sidebar-toggle bg-dark" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
    <i class="fa-solid fa-bars" style="color:#fff;"></i>
  </button>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="container-fluid d-flex p-0">

    <!-- Sidebar -->
    <aside class="bg-dark" id="sidebar">
      <button class="sidebar-expand-btn" id="sidebarExpandBtn" type="button" aria-label="Expand sidebar">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="dashboard-logo pb-4">
        <img src="assets/images/suplier-dashboard-logo.png" alt="logo" class="img-fluid">
      </div>
      <hr>
      <ul class="aside-menu">

        <li class="active">
          <img src="assets/images/icone/presentation.png" alt="">
          <a href="">Dashboard</a>
        </li>

        <li class="accordion px-0 py-3" id="accordionExample">
          <div class="accordion-item bg-dark border-0">
            <p class="accordion-header">
              <button class="accordion-button bg-dark p-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                MAIN
              </button>
            </p>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <ul class="aside-menu">
                  <li><img src="assets/images/icone/mdi_marketplace.png" alt=""><a href="">Marketplace</a></li>
                  <li><img src="assets/images/icone/order.png" alt=""><a href="">My Offers</a></li>
                  <li><img src="assets/images/icone/ix_package-filled.png" alt=""><a href="">Orders</a></li>
                  <li><img src="assets/images/icone/mage_delivery-truck-fill.png" alt=""><a href="">Deliveries</a></li>
                </ul>
              </div>
            </div>
          </div>
        </li>

      </ul>
    </aside>

    <!-- Main content -->
    <main id="mainContent">
      <div class = "d-flex justify-content-between align-items-center px-4">
        <h1 class = "title">Dashboard</h1>
        <ul class="right-menu d-flex align-items-center gap-3">
            <li><img src="assets/images/icone/repeat.png" alt=""></li>
            <li class = "notifi"><img src="assets/images/icone/Notification.png" alt="" >
                <span class="number">2</span>
            </li>
            <li class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="assets/images/icone/user.png" alt="" />
                 
                </button>
               <img src="assets/images/icone/arrow-down.svg" alt="">
                <ul class="dropdown-menu">
                    <li><button class="dropdown-item" type="button">Action</button></li>
                    <li><button class="dropdown-item" type="button">Another action</button></li>
                    <li><button class="dropdown-item" type="button">Something else here</button></li>
                </ul>
               
            </li>
            
        </ul>
      </div>
      <hr/>
    </main>

  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const mainContent = document.getElementById('mainContent');
      const toggleBtn = document.getElementById('sidebarToggle');
      const expandBtn = document.getElementById('sidebarExpandBtn');
      const closeBtn = document.getElementById('sidebarCloseBtn');

      const openSidebar = () => {
        sidebar?.classList.add('open');
        document.body.classList.add('sidebar-open');
        mainContent?.classList.add('shifted');
        overlay?.classList.add('active');
        toggleBtn?.setAttribute('aria-expanded', 'true');
      };

      const closeSidebar = () => {
        sidebar?.classList.remove('open');
        document.body.classList.remove('sidebar-open');
        mainContent?.classList.remove('shifted');
        overlay?.classList.remove('active');
        toggleBtn?.setAttribute('aria-expanded', 'false');
      };

      const toggleSidebar = () => {
        if (sidebar?.classList.contains('open')) {
          closeSidebar();
        } else {
          openSidebar();
        }
      };

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function (e) {
          e.preventDefault();
          toggleSidebar();
        });
      }

      if (expandBtn) {
        expandBtn.addEventListener('click', function (e) {
          e.preventDefault();
          openSidebar();
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.preventDefault();
          closeSidebar();
        });
      }

      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeSidebar();
        }
      });

      document.querySelectorAll('#sidebar a').forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth < 992) {
            closeSidebar();
          }
        });
      });
    });
  </script>

</body>
</html>
