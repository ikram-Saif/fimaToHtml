<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>Suplier Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="assets/css/style.css">
   

</head>
<body>
  <button class="sidebar-toggle bg-dark" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
    <i class="fa-solid fa-bars" style="color:#fff;"></i>
  </button>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="container-fluid d-flex p-0">

    <!-- Sidebar -->
    <aside class="bg-dark" id="sidebar">
      <button class="sidebar-expand-btn" id="sidebarExpandBtn" type="button" aria-label="Expand sidebar">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="dashboard-logo pb-4">
        <img src="assets/images/suplier-dashboard-logo.png" alt="logo" class="img-fluid">
      </div>
      <hr>
      <ul class="aside-menu">

        <li>
          <img src="assets/images/icone/presentation.png" alt="">
          <a href="">Dashboard</a>
        </li>

        <li class="accordion px-0 py-3" id="accordionExample">
          <div class="accordion-item bg-dark border-0">
            <p class="accordion-header">
              <button class="accordion-button bg-dark p-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                MAIN
              </button>
            </p>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <ul class="aside-menu">
                  <li ><img src="assets/images/icone/mdi_marketplace.png" alt=""><a href="">Marketplace</a></li>
                  <li ><img src="assets/images/icone/order.png" alt=""><a href="">My Offers</a></li>
                  <li><img src="assets/images/icone/ix_package-filled.png" alt=""><a href="">Orders</a></li>
                  <li class = "active"><img src="assets/images/icone/mage_delivery-truck-fill.png" alt=""><a href="">Deliveries</a></li>
                </ul>
              </div>
            </div>
          </div>
        </li>

      </ul>
    </aside>

    <!-- Main content -->
    <main class="suplier-dashboard">
      <!-- header -->
      <div class = "d-flex justify-content-between align-items-center px-4 bg-white">
        <h1 class = "title">Dashboard</h1>
        <ul class="right-menu d-flex align-items-center gap-3 px-4 py-3">
            <li><img src="assets/images/icone/repeat.png" alt=""></li>
            <li class = "notifi"><img src="assets/images/icone/Notification.png" alt="" >
                <span class="number">2</span>
            </li>
             <li class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="assets/images/icone/user.png" alt="User" />
                    <i class="fa-solid fa-caret-down ms-1 text-dark" aria-hidden="true"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end user-dropdown">
                    <li class = "text-center py-2">
                      <a class="dropdown-item">
                        <img src="assets/images/icone/user.png" alt="" class ="me-2 profile-img">
                        MY Profile</a>
                    </li>
                     <li class = "border-0 logout text-center"> 
                       <a href="" style="color:#FF6C52;">
                        <img src="assets/images/icone/logout.png" alt="" class = "me-3">
                        Logout 
                      </a>
                      </li>
                </ul>
               
            </li>
            
        </ul>
      </div>
      <hr/>
      <!-- end header -->
       <!-- content -->
      <div class="dashboardContent">
       <div class = "greeting d-flex justify-content-between align-items-center flex-wrap gap-2 pb-2">
        <div>
            <h1>Profile & Settings</h1>
            <p>Manage your supplier profile and preferences</p>
        </div>
      
      </div>
        <div class="profile-form d-flex flex-column gap-4">
            <h1 class = "title">Business Information</h1>
           <form action="">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="fname" class="form-label">First Name</label>
              <input type="text" class="form-control" id="fname" placeholder="Enter First Name">
            </div>

            <div class="col-12 col-md-6">
              <label for="lname" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lname" placeholder="Enter Last Name">
            </div>

            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="Enter Phone Number">
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter Email">
            </div>

          </div>
        </form>
        </div>
         
            </div>
           </div>

         </div>

        
        <!-- end content -->
         </div>
    
    </main>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/sidebar.js"> </script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="assets/js/chaer.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

</body>
</html>
